name: Build ScamShield Kotlin APK

on:
  workflow_dispatch:
  push:
    branches: [scamshield-apk-ci]
    paths:
      - ".apk-source/**"
      - ".github/workflows/build-scamshield-kotlin-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Reconstruct, build and verify Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Kotlin project source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .apk-source/source-*.b64 | base64 --decode > ScamShieldApk-source.zip
          unzip -t ScamShieldApk-source.zip
          unzip -q ScamShieldApk-source.zip
          test -f ScamShieldApk/settings.gradle.kts
          test -f ScamShieldApk/app/src/main/java/rs/scamshield/app/MainActivity.kt
          test -f ScamShieldApk/web/scamshield-app.html

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Bundle offline web app and QR decoder
        working-directory: ScamShieldApk
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp web/scamshield-app.html app/src/main/assets/index.html
          curl --retry 3 --retry-all-errors -fsSL \
            https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js \
            -o app/src/main/assets/jsQR.js
          sed -i 's#https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js#jsQR.js#g' \
            app/src/main/assets/index.html
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/jsQR.js

      - name: Prepare and validate optional persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done

          if [ "$present" -eq 0 ]; then
            echo "No persistent signing secrets found; this is a sideload test build signed with the runner debug key."
          elif [ "$present" -ne 4 ]; then
            echo "Signing secrets are incomplete. Configure all four ANDROID_* secrets or remove all four." >&2
            exit 1
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            chmod 600 "$GITHUB_WORKSPACE/release.keystore"
            test -s "$GITHUB_WORKSPACE/release.keystore"
            keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "Persistent Android signing key validated."
          fi

      - name: Build release APK
        working-directory: ScamShieldApk
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            -PversionName="1.0.$GITHUB_RUN_NUMBER"

      - name: Validate APK, signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="ScamShieldApk/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" ScamShield.apk
          unzip -t ScamShield.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ScamShield.apk
          sha256sum ScamShield.apk | tee ScamShield.apk.sha256
          file ScamShield.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScamShield-Kotlin-APK
          path: |
            ScamShield.apk
            ScamShield.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kotlin-apk-build-${{ github.run_number }}
          name: ScamShield Kotlin Android build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            ScamShield.apk
            ScamShield.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
