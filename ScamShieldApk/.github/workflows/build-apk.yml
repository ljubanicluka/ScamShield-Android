name: Build ScamShield APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Bundle the web app and the QR library (the app works offline afterwards)
        run: |
          mkdir -p app/src/main/assets
          cp web/scamshield-app.html app/src/main/assets/index.html
          curl -fsSL https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js -o app/src/main/assets/jsQR.js
          sed -i 's#https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js#jsQR.js#' app/src/main/assets/index.html
      - name: Prepare and validate the persistent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=("$ANDROID_KEYSTORE_BASE64" "$ANDROID_STORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ]; then
            echo "No signing secrets configured; using the runner debug key for a test build only."
          elif [ "$present" -ne 4 ]; then
            echo "Signing configuration is incomplete. Configure all four ANDROID_* secrets or remove all four." >&2
            exit 1
          else
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
            chmod 600 "$GITHUB_WORKSPACE/release.keystore"
            test -s "$GITHUB_WORKSPACE/release.keystore"
            keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storepass:env ANDROID_STORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" >/dev/null
            mkdir -p "$RUNNER_TEMP/signing-check"
            printf 'ScamShield signing validation\n' > "$RUNNER_TEMP/signing-check/check.txt"
            jar --create --file "$RUNNER_TEMP/signing-check.jar" --no-manifest -C "$RUNNER_TEMP/signing-check" .
            jarsigner -keystore "$GITHUB_WORKSPACE/release.keystore" \
              -storepass:env ANDROID_STORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
              "$RUNNER_TEMP/signing-check.jar" "$ANDROID_KEY_ALIAS" >/dev/null
            jarsigner -verify "$RUNNER_TEMP/signing-check.jar" >/dev/null
            rm -rf "$RUNNER_TEMP/signing-check" "$RUNNER_TEMP/signing-check.jar"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
            echo "Persistent signing keystore validated."
          fi
      - name: Build APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="1.0.$GITHUB_RUN_NUMBER"
      - name: Validate APK and calculate checksum
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk ScamShield.apk
          test -s ScamShield.apk
          unzip -t ScamShield.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs ScamShield.apk
          sha256sum ScamShield.apk | tee ScamShield.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ScamShield-APK
          path: |
            ScamShield.apk
            ScamShield.apk.sha256
      - name: Publish a GitHub Release with a direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: ScamShield APK build ${{ github.run_number }}
          files: |
            ScamShield.apk
            ScamShield.apk.sha256
