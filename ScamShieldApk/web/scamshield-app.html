<!doctype html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScamShield</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#17233d;--mu:#5d6b86;--ln:#e0e5ef;--ac:#1769d2;--as:#e7f0ff;--on-ac:#fff;--ok:#168c50;--wa:#c26a00;--bd:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--sf:#1a2233;--tx:#eef1f8;--mu:#9aa7c2;--ln:#2b364d;--as:#3a3218;--ac:#f3d34a;--on-ac:#151515;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--sf:#1a2233;--tx:#eef1f8;--mu:#9aa7c2;--ln:#2b364d;--as:#3a3218;--ac:#f3d34a;--on-ac:#151515;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin-inline:auto;padding-bottom:110px}
body.big{zoom:1.18}
header{display:flex;align-items:center;gap:6px;padding:12px;background:var(--ac);color:var(--on-ac);position:sticky;top:0;z-index:5}
header b{flex:1;font-size:18px}header button{background:#fff3;color:var(--on-ac);border:0;border-radius:10px;padding:7px 10px;font-weight:700}
main{padding:12px}h1,h2{margin:.2em 0 .4em}h2{font-size:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.mu{color:var(--mu);font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;font-weight:700;min-height:96px;display:flex;flex-direction:column;gap:8px}
.tile i{font-style:normal;width:40px;height:40px;border-radius:12px;background:var(--as);color:var(--ac);display:grid;place-items:center;font-size:22px}
.b{width:100%;padding:12px;border:0;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:800;font-size:16px;margin-top:8px}
.b.alt{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
input,textarea,select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:99px;padding:7px 12px;font-weight:700;font-size:14px}
.chip.on{background:var(--ac);color:var(--on-ac);border-color:var(--ac)}
.v{display:inline-block;padding:4px 10px;border-radius:99px;color:#fff;font-weight:800;font-size:13px}
.scam{background:var(--bd)}.susp{background:var(--wa)}.rep{background:#5d6b86}.caut{background:var(--wa)}.none{background:var(--ok)}
.bar{height:12px;border-radius:6px;background:var(--ac);margin:4px 0 10px}
label.k{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--ln)}label.k input{width:auto;margin:3px 0 0}
.home{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;border:0;background:var(--ac);color:var(--on-ac);font-size:26px;line-height:1;box-shadow:0 6px 18px #0004;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9}
.home small{font-size:10px;font-weight:800}
.warn{background:var(--as);border-radius:12px;padding:8px 12px;font-size:13px;margin:8px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#17233d;color:#fff;padding:9px 14px;border-radius:12px;z-index:20;display:none}
video{width:100%;border-radius:12px;margin-top:8px}a{color:var(--ac);font-weight:700}
</style></head><body>
<header><b>ScamShield</b><button data-a=lang></button><button data-a=cyr id=cy></button><button data-a=theme>◐</button></header>
<main id=app></main><div id=toast></div>
<button class=home data-a=home id=hb></button>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={lang:'sr',cyr:0,th:'',big:0,c:'rs',done:0,ob:0,ck:{},ev:[],rep:[],rt:[],fam:0,me:{},vt:{},cm:{}},pg='home',last='check',qz={i:0,s:0,a:-1};
let LIVE={sources:[],items:[],refreshedAt:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('ss')||'{}'))}catch(e){}
const sv=()=>{try{localStorage.setItem('ss',JSON.stringify(S))}catch(e){}};
// ---- Serbian Latin <-> Cyrillic ----
const P=[['lj','љ'],['nj','њ'],['dž','џ'],['a','а'],['b','б'],['v','в'],['g','г'],['d','д'],['đ','ђ'],['e','е'],['ž','ж'],['z','з'],['i','и'],['j','ј'],['k','к'],['l','л'],['m','м'],['n','н'],['o','о'],['p','п'],['r','р'],['s','с'],['t','т'],['ć','ћ'],['u','у'],['f','ф'],['h','х'],['c','ц'],['č','ч'],['š','ш']];
const KEEP=/(ScamShield|AnyDesk|TeamViewer|MTS|SMS|PIN|OTP|CVV|DEMO|QR|VPN|Wi-Fi|CERT|SI-CERT|Malwarebytes|Proton|Defender|Android|iPhone|Google|Play|Protect|OpenStreetMap|https?:\/\/\S+)/;
const cy=s=>s.split(KEEP).map((p,i)=>{if(i%2)return p;for(const[l,c]of P){p=p.split(l).join(c);p=p.split(l[0].toUpperCase()+l.slice(1)).join(c.toUpperCase())}return p}).join('');
const la=s=>{for(const[l,c]of P){s=s.split(c).join(l);s=s.split(c.toUpperCase()).join(l[0].toUpperCase()+l.slice(1))}return s};
const nz=s=>la(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const T=(sr,en)=>S.lang==='en'?en:(S.cyr?cy(sr):sr);
const target=s=>{s=s.trim();if(/^[+\d\s().\/-]{6,}$/.test(s)){let d=s.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='381'+d.slice(1);return'+'+d}return nz(s)};
const mask=s=>s.replace(/[\w.+-]+@[\w-]+\.[\w.]+/g,'[email]').replace(/(\+?381|\b0(?!\d?[./]\d))[\d\s()./-]{6,}\d/g,'[tel]').replace(/\b(pin|otp|cvv|kod|lozinka|password)\b\s*[:=]?\s*(?=\S*\d)\S{4,}/gi,'$1: [***]');
// ---- demo data (all DEMO) ----
const DIR=[['+381605550101','bank',12,'Poziva „služba bezbednosti“ i traži da instalirate AnyDesk.','Caller claims to be bank security and asks you to install AnyDesk.'],['paket-info-dostava.xyz','courier',7,'SMS: „Plati malu taksu za paket“. Link krade podatke kartice.','SMS: “Pay a small parcel fee”. The link steals card data.'],['+381615550188','romance',3,'Nedeljama gradi poverenje, pa traži novac za „hitan slučaj“.','Builds trust for weeks, then asks for money for an “emergency”.'],['winner@prize-center.top','prize',1,'Email kaže da ste osvojili telefon; platite poštarinu karticom.','Email says you won a phone; pay shipping by card.']];
const TY={bank:['Lažni poziv banke','Fake bank call'],courier:['Kurirska SMS poruka','Courier SMS'],prize:['Lažna nagrada','Fake prize'],romance:['Ljubavna prevara','Romance scam'],invest:['Investiciona prevara','Investment scam'],tech:['Lažna tehnička podrška','Tech support scam']};
const CN={rs:['Srbija','Serbia'],ba:['Bosna i Hercegovina','Bosnia and Herzegovina'],me:['Crna Gora','Montenegro'],mk:['Severna Makedonija','North Macedonia'],hr:['Hrvatska','Croatia']};
const CT={rs:['192','https://www.cert.rs/rs/obavestenja.html',''],ba:['122','https://cert.aikt.rs/','CERT RS pokriva samo Republiku Srpsku.|CERT RS covers only Republika Srpska.'],me:['122','https://www.gov.me/gov-cirt','Stranica nije automatski proverena.|The page was not automatically verified.'],mk:['192','https://mkd-cirt.mk/category/vesti/',''],hr:['192','https://www.cert.hr/','']};
const G=[['Dao/la sam podatke kartice ili poslao/la novac','Gave card details or sent money',[['Odmah pozovite banku i blokirajte karticu','Call your bank now and block the card'],['Zatražite zaustavljanje ili opoziv transfera','Ask the bank to stop or recall the transfer'],['Promenite lozinke e-bankinga, uključite dvostepenu prijavu','Change e-banking passwords, turn on 2-step login'],['Sačuvajte dokaze i prijavite policiji','Keep evidence and report to the police']]],['Podelio/la sam lozinku ili kliknuo/la link','Shared a password or clicked a link',[['Promenite lozinku svuda gde ste je koristili','Change the password everywhere you reused it'],['Uključite dvostepenu verifikaciju','Turn on 2-step verification'],['Odjavite sve uređaje u podešavanjima naloga','Log out of all devices in account settings'],['Skenirajte uređaj i upozorite kontakte','Scan your device and warn your contacts']]],['Dao/la sam daljinski pristup ili instalirao/la aplikaciju','Gave remote access or installed an app',[['Isključite internet (Wi-Fi i podatke)','Turn off the internet (Wi-Fi and data)'],['Deinstalirajte AnyDesk, TeamViewer ili nepoznatu aplikaciju','Uninstall AnyDesk, TeamViewer or any unknown app'],['Sa drugog uređaja promenite važne lozinke','From another device change important passwords'],['Pozovite banku; ako niste sigurni, resetujte uređaj','Call your bank; if unsure, factory reset the device']]]];
const Q=[['SMS: „Paket je zadržan. Uplatite 120 RSD na bit.ly/x1 danas.“','SMS: “Parcel held. Pay 120 RSD at bit.ly/x1 today.”',1,'Skraćen link + mala taksa + rok = klasična kurirska prevara.','Short link + small fee + deadline = classic courier scam.'],['Poziv: „Banka je. Pročitajte nam kod koji smo vam poslali.“','Call: “This is your bank. Read us the code we texted you.”',1,'Banke nikad ne traže kodove.','Banks never ask for codes.'],['Upravo ste se prijavili na email i stigao je SMS kod.','You just logged in to your email and got an SMS code.',0,'Vi ste ga pokrenuli. Samo ga nikome ne govorite.','You triggered it. Just never share it.'],['„Bako, u nevolji sam. Pošalji novac i nemoj da kažeš tati.“','“Grandma, I am in trouble. Send money and do not tell Dad.”',1,'Tajnost + hitnost. Pozovite unuče na pravi broj.','Secrecy + urgency. Call your grandchild on the real number.']];
const TL=[['Microsoft Defender (Windows)','Ugrađen i besplatan. Neka bude uključen i ažuran.','Built in and free. Keep it on and updated.'],['Google Play Protect (Android)','Ugrađen u Android. Instalirajte samo iz Play prodavnice.','Built into Android. Install only from the Play Store.'],['Malwarebytes Free','Skener za drugo mišljenje. Koliko znam, ručno skeniranje; proverite uslove.','Second-opinion scanner. As far as I know on-demand only; check the terms.'],['Proton VPN Free','Besplatan VPN poznatog provajdera; manje servera. Proverite uslove.','A free VPN from a known provider; fewer servers. Check the terms.'],['Izbegavajte','Nepoznate besplatne VPN-ove i „krekovane“ programe.','Unknown free VPNs and “cracked” software.']];
const SIG=[[/(?<![a-z])(hitno|odmah|urgent|immediately|within 24)(?![a-z])/,'Pritisak da reagujete odmah','Pressure to act now'],[/(?<![a-z])(uplat\w*|western union|crypto|bitcoin|gift card|send money)/,'Traži novac ili uplatu','Asks for money'],[/(?<![a-z])(pin|cvv|otp|lozink\w*|password|sifr\w*|verification code)(?![a-z])/,'Traži kod, PIN ili lozinku','Asks for a code, PIN or password'],[/bit\.ly|tinyurl|\.xyz|\.top|\.click|http:\/\//,'Sumnjiv link','Suspicious link'],[/(?<![a-z])(pobedili|nagrad\w*|winner|prize|lottery|nasledstv\w*)/,'Mamac: nagrada ili nasledstvo','Prize or inheritance bait'],[/(?<![a-z])(banka|banke|bank|kurir\w*|paket\w*|courier|parcel)(?![a-z])/,'Predstavlja se kao banka ili kurir','Pretends to be a bank or courier']];
const VL={scam:['VEROVATNA PREVARA','LIKELY SCAM'],susp:['SUMNJIVO','SUSPICIOUS'],rep:['PRIJAVLJENO','REPORTED'],caut:['OPREZ','BE CAREFUL'],none:['NEMA DOVOLJNO PODATAKA','NOT ENOUGH DATA']};
const BR=['paypal','intesa','raiffeisen','erste','posta','yettel','mts','dhl','google','apple','microsoft','facebook','amazon','netflix'],SH=['bit.ly','tinyurl.com','t.ly','cutt.ly','is.gd','rb.gy'],TD=['.xyz','.top','.click','.icu','.buzz','.shop','.zip'];
// ---- analysis ----
function verdict(q){const k=target(q),n=nz(q),hits=DIR.filter(d=>k.includes(d[0])||n.includes(d[0])),ind=hits.reduce((a,d)=>a+d[2],0),fl=SIG.filter(s=>s[0].test(n));
const v=ind>=5?'scam':(ind>=3||fl.length>=3)?'susp':ind>0?'rep':fl.length?'caut':'none';return{v,ind,fl,hits}}
function linkScan(s){s=s.trim();if(!s)return null;let u;try{u=new URL(/:\/\//.test(s)?s:'http://'+s)}catch(e){return{h:'?',f:[['Ovo ne liči na ispravan link.','This does not look like a valid link.']]}}
const h=u.hostname.toLowerCase(),f=[],plain=h.replace(/0/g,'o').replace(/1/g,'l').replace(/rn/g,'m').replace(/vv/g,'w');
if(u.protocol==='http:')f.push(['Nema šifrovanja (http).','No encryption (http).']);if(/^[\d.]+$/.test(h)||h.includes(':'))f.push(['Adresa je IP broj.','The address is an IP number.']);if(h.includes('xn--'))f.push(['Zamaskirana slova (punycode).','Disguised characters (punycode).']);if(SH.includes(h))f.push(['Skraćeni link krije odredište.','A short link hides the destination.']);if(TD.some(t=>h.endsWith(t)))f.push(['Domen se često koristi za prevare.','This domain ending is often used for scams.']);if(h.split('.').length>=5)f.push(['Mnogo poddomena.','Many subdomains.']);if(s.includes('@'))f.push(['Znak @ može da sakrije pravi sajt.','An @ can hide the real site.']);if(s.length>90)f.push(['Veoma dugačak link.','Very long link.']);
const b=BR.find(x=>plain.includes(x));if(b&&(h.includes('-')||TD.some(t=>h.endsWith(t))))f.push(['Liči na „'+b+'“, ali domen nije njihov.','Resembles “'+b+'” but the domain is not theirs.']);
const hit=DIR.some(d=>d[0]===h);if(hit)f.push(['Postoji u DEMO listi prijava.','Present in the DEMO report list.']);return{h,f}}
// ---- pages ----
const TILES=[['check','⌕','Provera','Check'],['link','⛓','Link i QR (ne otvara ništa)','Link & QR (opens nothing)'],['feed','◷','Zajednica','Community'],['report','＋','Prijavi','Report'],['help','♡','Prevaren/a sam','I got scammed'],['family','☺','Porodica','Family'],['map','⌖','Mapa prevara','Scam map'],['learn','✎','Učenje','Learn'],['tools','⛨','Antivirus i VPN','Antivirus & VPN'],['evidence','▤','Dokazi','Evidence'],['contacts','☏','Kontakti','Contacts'],['news','⚑','Zvanična upozorenja','Official warnings'],['pass','⚿','Provera lozinke','Password check'],['hash','#','Provera fajla (SHA-256)','File hash check'],['breach','✉','Provera curenja podataka','Breach check'],['privacy','⚙','Privatnost','Privacy']];
const chips=()=>`<div class=chips>${Object.keys(CN).map(c=>`<button class="chip ${S.c===c?'on':''}" data-a=cn data-v=${c}>${T(CN[c][0],CN[c][1])}</button>`).join('')}<button class=chip disabled>${T('Još regiona (uskoro)','More regions (soon)')}</button></div>`;
const foot=()=>`<p class=warn>${T('Primeri za proveru su DEMO. Nema povezivanja sa MTS-om. Nepostojanje poznatih prijava ne znači da je nešto bezbedno.','Checker examples are DEMO. No MTS integration. No known reports does not mean something is safe.')}</p>`;
const PG={
home:()=>`<h1>ScamShield</h1><p class=mu>${T('Proveri pre nego što poveruješ. Dugme u sredini te vraća ovde, a još jednim dodirom nazad.','Check before you trust. The middle button brings you here; one more tap takes you back.')}</p>${chips()}<div class=card><b>${T('Pregled','Overview')}</b><p class=mu>${T('Primeri provere','Checker examples')}: DEMO · ${T('Lokalne beleške','Local notes')}: ${S.rep.length} · ${T('Dokazi','Evidence')}: ${S.ev.length}</p></div><div class=grid>${TILES.map(t=>`<button class=tile data-a=go data-v=${t[0]}><i>${t[1]}</i>${T(t[2],t[3])}</button>`).join('')}</div>${foot()}`,
check:()=>`<h2>${T('Provera','Check')}</h2><p class=mu>${T('Broj, email, link ili tekst poruke.','Number, email, link or message text.')}</p><textarea id=q rows=3></textarea><button class=b data-a=chk>${T('Proveri','Check')}</button><div id=r></div>${foot()}`,
link:()=>`<h2>${T('Link i QR (ne otvara ništa)','Link & QR (opens nothing)')}</h2><p class=mu>${T('Analiza se radi na telefonu. Link se nikad ne otvara.','Analysis runs on your phone. The link is never opened.')}</p><input id=li placeholder="https://..."><button class=b data-a=lk>${T('Analiziraj link','Analyse link')}</button><button class="b alt" data-a=qr>${T('Skeniraj QR uživo','Scan QR live')}</button><button class="b alt" data-a=qi data-v=qf>${T('Uvezi QR iz galerije','Import QR from gallery')}</button><button class="b alt" data-a=qi data-v=qc>${T('Slikaj QR kod','Take a photo of a QR code')}</button><input id=qf type=file accept="image/*" hidden><input id=qc type=file accept="image/*" capture=environment hidden><div id=qv></div><div id=lr></div>${foot()}`,
    feed:()=>{const ps=S.rep.map((p,i)=>({p,i})).filter(x=>x.p[0]===S.c);return`<h2>${T('Moje lokalne beleške','My local notes')}</h2>${chips()}<p class=warn>${T('Ovo nije javni feed. Beleške su sačuvane samo na ovom telefonu i nisu poslate drugim ljudima. Zajednička zajednica zahteva budući server.','This is not a public feed. Notes are saved only on this phone and are not shared. A shared community requires a future backend.')}</p><button class=b data-a=go data-v=report>${T('Napravi belešku o prevari','Create a scam note')}</button>${ps.length?ps.map(({p,i})=>{const newer=p[5]===true,when=newer?new Date(p[4]).toLocaleString():T('Starija lokalna beleška','Older local note'),targetText=newer?p[2]:T('Cilj nije sačuvan u starijoj belešci','Target was not retained in this older note'),body=newer?p[3]:p[2];return`<div class=card><span class=v rep>${T(TY[p[1]][0],TY[p[1]][1])}</span> <span class=v style="background:#5d6b86">${T('SAMO NA UREĐAJU','DEVICE ONLY')}</span><p class=mu>${E(when)}</p><p><b>${T('Meta','Target')}:</b> ${E(targetText)}</p><p>${E(body)}</p><button class="b alt" data-a=rd data-v=${i}>${T('Obriši belešku','Delete note')}</button></div>`}).join(''):`<div class=card><b>${T('Još nema lokalnih beleški','No local notes yet')}</b><p class=mu>${T('Sačuvaj prijavu kao privatnu belešku. Ništa se ne objavljuje niti šalje.','Save a report as a private note. Nothing is published or sent.')}</p></div>`}`},
report:()=>`<h2>${T('Prijavi prevaru','Report a scam')}</h2><select id=rt>${Object.keys(TY).map(k=>`<option value=${k}>${T(TY[k][0],TY[k][1])}</option>`).join('')}</select><input id=rq placeholder="${T('Broj, email ili link','Number, email or link')}"><textarea id=rd rows=4 placeholder="${T('Šta se desilo? Uklonite lične podatke pre čuvanja.','Describe what happened. Remove personal data before saving.')}"></textarea><button class=b data-a=rep>${T('Sačuvaj privatnu belešku','Save private note')}</button><p class=mu>${T('Čuva se samo na ovom telefonu. Automatsko maskiranje je ograničeno; proverite tekst i uklonite imena, adrese, kodove i druge lične podatke.','Saved only on this phone. Automatic masking is limited; review the text and remove names, addresses, codes and other personal information.')}</p>${foot()}`,
help:()=>`<h2>${T('Prevaren/a sam','I got scammed')}</h2>${G.map((g,i)=>`<div class=card><b>${T(g[0],g[1])}</b>${g[2].map((s,j)=>`<label class=k><input type=checkbox data-a=ck data-v=${i}_${j} ${S.ck[i+'_'+j]?'checked':''}><span>${T(s[0],s[1])}</span></label>`).join('')}</div>`).join('')}<p class=mu>${T('Prvo pozovite svoju banku i policiju (192/122).','Call your bank and the police first (192/122).')}</p>${foot()}`,
family:()=>`<h2>${T('Zaštiti porodicu','Protect your family')}</h2><p class=mu>${T('Sve ide uz pristanak: nikoga ne pratimo i poruke se ne prosleđuju bez znanja druge osobe.','Everything is consent-based: nobody is tracked and no messages are forwarded without their knowledge.')}</p><div class=card>${[['Dogovorite porodičnu šifru za prave hitne slučajeve','Agree on a family safe word'],['Banke nikad ne traže PIN ni SMS kodove','Banks never ask for a PIN or SMS codes'],['Prekinite poziv i pozovite nazad na zvanični broj','Hang up and call back on the official number'],['Bez AnyDesk/TeamViewer na tuđ zahtev','No AnyDesk/TeamViewer on request'],['Deca: bez linkova od nepoznatih, recite odraslom','Kids: no links from strangers, tell an adult']].map((s,j)=>`<label class=k><input type=checkbox data-a=ck data-v=f${j} ${S.ck['f'+j]?'checked':''}><span>${T(s[0],s[1])}</span></label>`).join('')}</div><div class=card><b>${T('Poruka upozorenja','Warning message')}</b><input id=ft placeholder="${T('Sumnjiv broj ili link','Suspicious number or link')}"><p id=fm class=mu></p><button class=b data-a=fm>${T('Napravi i kopiraj poruku','Create and copy message')}</button></div><p class=mu>${T('Prava blokada poziva traži saradnju operatera i dozvole sistema. Ovo je demonstracija.','Real call blocking needs the operator and OS permissions. This is a demo.')}</p>${foot()}`,
    map:()=>`<h2>${T('Mapa prevara','Scam map')}</h2>${chips()}<div class=card><b>${T('Nema potvrđenih podataka po gradovima','No verified city-level data')}</b><p>${T('Ova verzija ne prikazuje izmišljene brojeve ili lokacije. Za sada nema povezanog sistema koji prikuplja i proverava prijave po gradovima.','This version does not display invented counts or locations. There is currently no connected system collecting and verifying city-level reports.')}</p></div><h3>${T('Zvanični izvori','Official sources')}</h3>${NW.map(n=>`<div class=card><a href="${n[1]}" target=_blank rel=noopener>${E(n[0])}</a></div>`).join('')}`,
learn:()=>{const q=Q[qz.i];if(!q)return`<h2>${T('Rezultat','Score')}: ${qz.s}/${Q.length}</h2><button class=b data-a=qrs>${T('Ponovo','Restart')}</button>`;return`<h2>${T('Prepoznaj prevaru','Spot the scam')} ${qz.i+1}/${Q.length}</h2><div class=card>${T(q[0],q[1])}</div>${qz.a<0?`<button class=b data-a=qa data-v=1>${T('Prevara je','It is a scam')}</button><button class="b alt" data-a=qa data-v=0>${T('Deluje pravo','Looks real')}</button>`:`<p class=card>${qz.a==q[2]?'✔ ':'✖ '}${T(q[3],q[4])}</p><button class=b data-a=qn>${T('Dalje','Next')}</button>`}`},
tools:()=>`<h2>${T('Antivirus i VPN','Antivirus & VPN')}</h2><p class=warn>${T('VPN ne zaustavlja prevarante ni phishing, a antivirus ne sprečava da kažete kod pozivaocu. Bez sponzora. Proverite na zvaničnim sajtovima.','A VPN does not stop scammers or phishing, and antivirus cannot stop you telling a caller a code. No sponsors. Verify on official sites.')}</p>${TL.map(t=>`<div class=card><b>${t[0]}</b><p>${T(t[1],t[2])}</p></div>`).join('')}`,
evidence:()=>`<h2>${T('Dokazi','Evidence locker')}</h2><input id=et placeholder="${T('Naslov','Title')}"><textarea id=en rows=3 placeholder="${T('Šta se desilo, broj, iznos, referenca...','What happened, number, amount, reference...')}"></textarea><button class=b data-a=ev>${T('Sačuvaj','Save')}</button><p class=mu>${T('Samo na ovom telefonu. Ne čuvajte broj kartice ni PIN.','Only on this phone. Do not store card numbers or PINs.')}</p>${S.ev.map((e,i)=>`<div class=card><small class=mu>${e[0]}</small><b> ${E(e[1])}</b><p>${E(e[2])}</p><button class="b alt" data-a=evd data-v=${i}>${T('Obriši','Delete')}</button></div>`).join('')}`,
contacts:()=>`<h2>${T('Zvanični kontakti','Official contacts')}</h2><p class=warn>${T('Proverite svaki kontakt pre upotrebe.','Verify every contact before use.')}</p>${Object.keys(CT).map(c=>{const x=CT[c],n=x[2].split('|');return`<div class=card><b>${T(CN[c][0],CN[c][1])}</b><p><a href="tel:${x[0]}">${T('Policija','Police')}: ${x[0]}</a></p><p><a href="${x[1]}" target=_blank rel=noopener>${T('Nacionalni CERT / obaveštenja','National CERT / advisories')}</a></p><p class=mu>${n[0]?T(n[0],n[1]):''}</p></div>`}).join('')}<p class=mu>${T('Prevara karticom: pozovite broj sa poleđine kartice. Operater: koristite njegovu zvaničnu stranicu ili aplikaciju.','Card fraud: call the number on the back of your card. Operator: use its official website or app.')}</p>`,
privacy:()=>`<h2>${T('Privatnost i podešavanja','Privacy & settings')}</h2><div class=card><p>${T('Uneti podaci, beleške i QR sadržaj ostaju na telefonu. Aplikacija preuzima samo javna upozorenja sa navedenih CERT/CIRT izvora; tim izvorima se ne šalju tvoje pretrage, poruke ili QR sadržaj. Spoljni sajtovi mogu primiti uobičajene podatke o poseti.','Entered data, notes and QR contents stay on this phone. The app downloads only public advisories from the listed CERT/CIRT sources; your searches, messages and QR contents are not sent to those sources. External websites may receive normal visit data.')}</p><p class=mu>${T('Zvanična upozorenja se preuzimaju uživo. Provera brojeva i linkova i dalje koristi lokalne heuristike i DEMO primere, ne reputacionu bazu.','Official advisories are fetched live. Number and link checks still use local heuristics and DEMO examples, not a reputation database.')}</p></div><button class=b data-a=big>${S.big?T('Veliki tekst: UKLJUČEN','Large text: ON'):T('Uključi veliki tekst','Turn on large text')}</button><button class="b alt" data-a=del id=dl>${T('Obriši sve moje podatke','Delete all my data')}</button>`,
news:()=>`<h2>${T('Zvanična upozorenja','Official warnings')}</h2><p class=warn>${T('Preuzimaju se samo javne objave. Sadržaj koji uneseš u aplikaciju ne šalje se CERT/CIRT izvorima. CERT RS pokriva samo Republiku Srpsku, ne celu BiH.','Only public advisories are downloaded. Content you enter in the app is not sent to CERT/CIRT sources. CERT RS covers Republika Srpska only, not all of Bosnia and Herzegovina.')}</p><button class=b data-a=refreshNews>${T('Osveži upozorenja','Refresh advisories')}</button><div id=feedStatus>${renderFeedStatus()}</div><div id=feedItems>${renderFeedItems()}</div><h3>${T('Zvanične stranice','Official websites')}</h3>${NW.slice(0,4).map(n=>`<div class=card><a href="${n[1]}">${E(n[0])}</a></div>`).join('')}`,
pass:()=>`<h2>${T('Provera lozinke','Password check')}</h2><p class=mu>${T('Procena se radi na telefonu. Lozinka se nikad ne šalje niti čuva.','Rated on your phone. The password is never sent or stored.')}</p><input id=pw type=password autocomplete=off><button class=b data-a=pw>${T('Proceni','Rate')}</button><div id=pr></div>`,
hash:()=>`<h2>${T('Provera fajla (SHA-256)','File hash check')}</h2><p class=mu>${T('Fajl se ne šalje i ne pokreće; računa se samo otisak.','The file is not uploaded or run; only its fingerprint is computed.')}</p><input id=hf type=file><div id=hr class=card></div>`,
breach:()=>`<h2>${T('Provera curenja podataka','Breach check')}</h2><div class=card><p>${T('Proverite svoj email na Have I Been Pwned. Otvara se njihov sajt; ScamShield ne šalje ništa.','Check your own email on Have I Been Pwned. Their site opens; ScamShield sends nothing.')}</p><a href="https://haveibeenpwned.com/" target=_blank rel=noopener>haveibeenpwned.com</a><p class=mu>${T('Ako je email procurio: promenite lozinku, uključite dvostepenu prijavu.','If your email leaked: change the password and turn on 2-step login.')}</p></div>`,
ob:()=>{const s=[['Dobrodošli u ScamShield','Welcome to ScamShield','Proveri broj, link, QR kod ili poruku pre nego što poveruješ.','Check a number, link, QR code or message before you trust it.'],['Pomoć kad se desi prevara','Help when a scam happens','Jasni koraci, lista dokaza i poruke za porodicu.','Clear steps, an evidence list and messages for family.'],['Tvoja privatnost','Your privacy','Preuzimaju se javna upozorenja. Tvoje pretrage, poruke i QR sadržaj ostaju na telefonu.','Public advisories are downloaded. Your searches, messages and QR contents stay on your phone.']][S.ob];return`<div class=card style="text-align:center;margin-top:30px"><h1>${T(s[0],s[1])}</h1><p>${T(s[2],s[3])}</p><small class=mu>${S.ob+1}/3</small><button class=b data-a=obn>${S.ob>=2?T('Počni','Start'):T('Dalje','Next')}</button></div>`}};
const NW=[['Srbija: CERT.rs','https://www.cert.rs/rs/obavestenja.html'],['Crna Gora: CIRT','https://www.gov.me/gov-cirt'],['Severna Makedonija: MKD-CIRT','https://mkd-cirt.mk/category/vesti/'],['Republika Srpska: CERT RS','https://cert.aikt.rs/'],['Hrvatska: CERT.hr','https://www.cert.hr/'],['Slovenija: SI-CERT','https://www.cert.si/']],BAD=['0'.repeat(64)];
function feedDate(v){if(!v)return T('Datum nije dostupan','Date unavailable');const d=new Date(v);return Number.isNaN(d.getTime())?E(v):d.toLocaleString()}
function renderFeedStatus(){if(!LIVE.sources.length)return `<p class=mu>${T('Još nema preuzetih podataka. Dodirnite Osveži.','No advisories have been fetched yet. Tap Refresh.')}</p>`;return LIVE.sources.map(s=>{const status=s.status==='online'?T('Dostupno','Online'):s.status==='unavailable'?T('Nedostupno','Unavailable'):s.status==='cached'?T('Keširano','Cached'):T('Bez novih objava','No new items');const when=s.updatedAt?new Date(s.updatedAt).toLocaleString():T('Nikad','Never');return `<div class=card><b>${E(s.label)}</b><p class=mu>${status} · ${s.count} · ${T('Poslednje uspešno ažuriranje','Last successful update')}: ${E(when)}</p><p class=mu>${E(s.message||'')}</p></div>`}).join('')}
function renderFeedItems(){if(!LIVE.items.length)return `<div class=card>${T('Nema dostupnih upozorenja. Proverite status izvora ili otvorite zvaničnu stranicu.','No advisories are available. Check source status or open the official website.')}</div>`;return LIVE.items.map(item=>{const aud=item.audience==='ordinary'?T('Za građane','For ordinary users'):item.audience==='mixed'?T('Za građane i administratore','For users and administrators'):T('Za IT administratore','For IT administrators');return `<div class=card><span class=v style="background:${item.audience==='ordinary'?'#168c50':item.audience==='mixed'?'#8b6bb1':'#5d6b86'}">${aud}</span><h3>${E(item.title)}</h3>${item.excerpt?`<p>${E(item.excerpt)}</p>`:''}<p class=mu>${E(item.sourceLabel)} · ${E(feedDate(item.date))}</p><a href="${E(item.link)}">${T('Otvori originalnu objavu','Open original advisory')}</a></div>`}).join('')}
window.onLiveAdvisories=function(data){LIVE=data||{sources:[],items:[],refreshedAt:0};if(pg==='news'){const st=$('#feedStatus'),it=$('#feedItems'),rb=document.querySelector('[data-a=refreshNews]');if(st)st.innerHTML=renderFeedStatus();if(it)it.innerHTML=renderFeedItems();if(rb){rb.disabled=false;rb.textContent=T('Osveži upozorenja','Refresh advisories')}}};
function pwCheck(p){let sc=0;const f=[];if(p.length>=12)sc+=2;else if(p.length>=8)sc+=1;else f.push(['Prekratka (manje od 8 znakova).','Too short (under 8 characters).']);if(/[a-z]/.test(p)&&/[A-Z]/.test(p))sc+=1;else f.push(['Dodajte velika i mala slova.','Mix upper and lower case.']);if(/\d/.test(p))sc+=1;else f.push(['Dodajte brojeve.','Add numbers.']);if(/[^\w\s]/.test(p))sc+=1;else f.push(['Dodajte znak (!?#).','Add a symbol (!?#).']);if(/^(123456|password|lozinka|qwerty|111111|admin)/i.test(p)||/(.)\1{3,}/.test(p)){sc=0;f.push(['Predvidljiv obrazac.','Predictable pattern.'])}return{sc,f}}
addEventListener('change',async e=>{const i=e.target;if(i.id!=='hf'||!i.files[0])return;const f=i.files[0];if(f.size>5e7)return toast(T('Fajl je prevelik (preko 50 MB).','File too large (over 50 MB).'));$('#hr').textContent=T('Računam...','Computing...');const h=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');$('#hr').innerHTML='<b style="word-break:break-all">'+h+'</b><p>'+(BAD.includes(h)?T('Poklapa se sa DEMO listom.','Matches the DEMO list.'):T('Nema poklapanja u maloj DEMO listi. To nije dokaz da je fajl bezbedan.','No match in the small DEMO list. That is not proof the file is safe.'))+'</p>'});

function R(){document.body.classList.toggle('big',!!S.big);document.documentElement.dataset.theme=S.th;document.documentElement.lang=S.lang;
$('[data-a=lang]').textContent=S.lang==='sr'?'EN':'SR';const c=$('#cy');c.style.display=S.lang==='sr'?'':'none';c.textContent=S.cyr?'Lat':'Ћир';
const p=S.done?pg:'ob';$('#app').innerHTML=PG[p]();$('#hb').innerHTML=`<span>${pg==='home'?'↩':'⌂'}</span><small>${pg==='home'?T('Nazad','Back'):T('Početna','Home')}</small>`;$('#hb').style.display=S.done?'':'none'}
function go(p,push=true){if(p!=='link'&&window.stopScamShieldCamera)window.stopScamShieldCamera();pg=p;if(push)try{history.pushState({p},'')}catch(e){}R();scrollTo(0,0)}
addEventListener('popstate',()=>{if(window.stopScamShieldCamera)window.stopScamShieldCamera();if(pg!=='home'){pg='home';R()}});
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)};
const kindOf=t=>/^https?:\/\//i.test(t)?'url':/^WIFI:/i.test(t)?'wifi':/^(tel|sms|smsto|mailto|geo):/i.test(t)?'action':/^(bitcoin|ethereum|litecoin|monero|upi):|^BCD\n/i.test(t)?'pay':/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(t)?'url':'text';
const KN={url:['Veb adresa','Web address'],wifi:['Wi-Fi mreža','Wi-Fi network'],action:['Poziv/poruka/lokacija','Call/message/location'],pay:['Plaćanje','Payment'],text:['Tekst','Text']};
function lkRender(){const raw=$('#li').value.trim();if(!raw)return;const k=kindOf(raw);let html=`<div class=card><span class="v rep">${T(KN[k][0],KN[k][1])}</span><p class=mu>${T('Sadržaj (nije otvoren):','Content (not opened):')}</p><p style="word-break:break-all"><b>${E(raw)}</b></p>`;
if(k==='url'){const r=linkScan(raw);html+=`<p><span class="v ${r.f.length>=3?'scam':r.f.length?'caut':'none'}">${r.f.length>=3?T('Deluje rizično','Looks risky'):r.f.length?T('Budite oprezni','Be careful'):T('Nema očiglednih znakova','No obvious signs')}</span></p>${r.f.map(f=>`<p>• ${T(f[0],f[1])}</p>`).join('')}`}
else if(k==='wifi')html+=`<p>${T('Wi-Fi QR može da vas poveže na tuđu mrežu. Povežite se samo ako znate ko je vlasnik.','A Wi-Fi QR can connect you to someone else’s network. Join only if you know the owner.')}</p>`;
else if(k==='pay')html+=`<p>${T('Plaćanje: proverite primaoca i iznos pre bilo kakve uplate. Prevaranti lepe lažne QR kodove preko pravih.','Payment: check the recipient and amount before paying. Scammers stick fake QR codes over real ones.')}</p>`;
else if(k==='action')html+=`<p>${T('Ovaj QR pokreće poziv, poruku ili lokaciju. Ne pozivajte nepoznate brojeve iz QR koda.','This QR starts a call, message or location. Do not call unknown numbers from a QR code.')}</p>`;
else{const r=verdict(raw);html+=`<p><span class="v ${r.v}">${T(VL[r.v][0],VL[r.v][1])}</span></p>${r.fl.map(f=>`<p>• ${T(f[1],f[2])}</p>`).join('')}`}
$('#lr').innerHTML=html+`<p class=mu>${T('To nije dokaz da je bezbedno. Ništa nije otvoreno.','This is not proof it is safe. Nothing was opened.')}</p><button class="b alt" data-a=cp data-v="${E(raw)}">${T('Kopiraj sadržaj','Copy content')}</button></div>`}
// ---- QR decoding: native BarcodeDetector first, jsQR as fallback, several scales ----
async function decodeSource(src,w,h){if('BarcodeDetector'in window){try{const r=await new BarcodeDetector({formats:['qr_code']}).detect(src);if(r[0]&&r[0].rawValue)return r[0].rawValue}catch(e){}}
if(window.jsQR){for(const m of [1,.6,.35]){const W=Math.max(80,Math.round(Math.min(w,1600)*m)),H=Math.round(h*W/w),c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,W,H);const d=x.getImageData(0,0,W,H),r=jsQR(d.data,W,H,{inversionAttempts:'attemptBoth'});if(r&&r.data)return r.data}}return null}
async function decodeFile(f){try{const bm=await createImageBitmap(f);const t=await decodeSource(bm,bm.width,bm.height);bm.close&&bm.close();return t}catch(e){return null}}
let qrStop=null;
window.stopScamShieldCamera=()=>{if(qrStop)qrStop()};
async function qrScan(){if(qrStop){qrStop();return}try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}}),v=document.createElement('video');v.srcObject=st;v.muted=true;v.setAttribute('playsinline','');await v.play();$('#qv').replaceChildren(v);let on=1;const stop=()=>{on=0;st.getTracks().forEach(x=>x.stop());$('#qv').replaceChildren();qrStop=null};qrStop=stop;
const tick=async()=>{if(!on)return;if(v.videoWidth){const t=await decodeSource(v,v.videoWidth,v.videoHeight);if(t){stop();$('#li').value=t;lkRender();return}}setTimeout(tick,250)};tick();setTimeout(()=>{if(on){stop();toast(T('Nije pronađen QR kod. Probajte „Slikaj QR kod“ ili galeriju.','No QR found. Try “Take a photo” or the gallery.'))}},30000)}catch(e){toast(T('Kamera nije dostupna. Koristite „Slikaj QR kod“ ili galeriju.','Camera unavailable. Use “Take a photo” or the gallery.'))}}
addEventListener('change',async e=>{const i=e.target;if((i.id==='qf'||i.id==='qc')&&i.files&&i.files[0]){toast(T('Čitam sliku...','Reading image...'));const t=await decodeFile(i.files[0]);i.value='';if(t){$('#li').value=t;lkRender()}else toast(T('QR kod nije pronađen. Slikajte bliže, uz dobro svetlo, bez odsjaja.','No QR code found. Photograph closer, in good light, without glare.'))}});
const copy=async t=>{try{await navigator.clipboard.writeText(t);toast(T('Kopirano.','Copied.'))}catch(e){toast(t)}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='go'){last=pg==='home'?last:pg;go(v)}else if(a==='home'){if(pg==='home')go(last);else{last=pg;go('home')}}
else if(a==='lang'){S.lang=S.lang==='sr'?'en':'sr';sv();R()}else if(a==='cyr'){S.cyr=S.cyr?0:1;sv();R()}
else if(a==='theme'){S.th=document.documentElement.dataset.theme==='dark'||(!S.th&&matchMedia('(prefers-color-scheme:dark)').matches)?'light':'dark';sv();R()}
else if(a==='cn'){S.c=v;sv();R()}
